# Saltcorn en production : plusieurs nœuds, cache HTTP, Redis — sans CDN payant.
# Vérifié contre Saltcorn 1.6.2 et Traefik 3.x (Dokploy).
#
#   Internet → Traefik (HTTPS, en-têtes, limites de débit partagées dans Redis)
#            → cache (nginx : garde en mémoire les fichiers et les pages publiques)
#            → saltcorn (primary + web × N, répartition automatique)
#            → postgres
#
#   primary : 1 exemplaire, lance les migrations ; web : à dupliquer (replicas).
#   Les tâches planifiées tournent sur un seul nœud, élu automatiquement.
#   Image officielle : ENTRYPOINT = saltcorn, donc `command` = arguments de la CLI.
#
# Secrets à définir dans Dokploy (onglet Environment), JAMAIS dans ce fichier :
#   PGPASSWORD, SALTCORN_SESSION_SECRET, SALTCORN_JWT_SECRET, DOMAIN
#   (openssl rand -hex 48 pour les deux secrets)
#
# Pourquoi Redis ne sert pas « de cache à Saltcorn » : Saltcorn 1.6.2 ne sait pas
# parler à Redis (sessions, synchro et élection passent par Postgres, codé en dur).
# Redis sert ici aux limites de débit partagées de Traefik, et reste disponible
# pour tes autres services (n8n en mode queue, etc.).

x-saltcorn-env: &sc-env
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: saltcorn
  PGPASSWORD: ${PGPASSWORD}
  PGDATABASE: saltcorn
  SALTCORN_MULTI_TENANT: "true"
  SALTCORN_MULTI_NODE: "true"
  SALTCORN_NWORKERS: "3"
  # identiques sur tous les nœuds, sinon déconnexions en passant d'un nœud à l'autre
  SALTCORN_SESSION_SECRET: ${SALTCORN_SESSION_SECRET}
  SALTCORN_JWT_SECRET: ${SALTCORN_JWT_SECRET}
  NODE_ENV: production

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: saltcorn
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: saltcorn
    # connexions ≈ conteneurs × (NWORKERS × 10 + 2) → ajuste max_connections
    command: >
      postgres -c max_connections=200 -c shared_buffers=2GB
      -c effective_cache_size=6GB -c work_mem=16MB
      -c maintenance_work_mem=512MB -c random_page_cost=1.1
      -c log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]   # jamais exposé sur Internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saltcorn"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # pas de persistance : ce sont des compteurs de débit, reconstruits en secondes
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [dokploy-network]   # Traefik doit pouvoir l'atteindre ; aucun port publié

  primary:
    image: saltcorn/saltcorn:1.6.2
    restart: unless-stopped
    command: ["serve"]
    environment: *sc-env
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      internal:
        aliases: [saltcorn]

  web:
    image: saltcorn/saltcorn:1.6.2
    restart: unless-stopped
    command: ["serve", "--nomigrate"]
    environment: *sc-env
    depends_on: [primary]
    deploy:
      replicas: 2
    networks:
      internal:
        aliases: [saltcorn]

  cache:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [primary]
    configs:
      - source: nginx_cache
        target: /etc/nginx/conf.d/default.conf
    tmpfs:
      - /var/cache/nginx:size=512m
    networks: [internal, dokploy-network]
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.saltcorn.rule: HostRegexp(`^(.+\.)?${DOMAIN}$$`)
      traefik.http.routers.saltcorn.entrypoints: websecure
      traefik.http.routers.saltcorn.tls.certresolver: letsencrypt
      traefik.http.routers.saltcorn.middlewares: sc-ratelimit,sc-headers
      traefik.http.services.saltcorn.loadbalancer.server.port: "80"
      traefik.http.services.saltcorn.loadbalancer.healthcheck.path: /auth/login
      traefik.http.services.saltcorn.loadbalancer.healthcheck.interval: 10s
      # limite par IP partagée entre toutes les instances de Traefik (Traefik ≥ 3.4) :
      # moyenne 50 req/s, rafale 100. Si ta version refuse « redis », retire la ligne
      # redis.endpoints : la limite reste active, en mémoire.
      traefik.http.middlewares.sc-ratelimit.ratelimit.average: "50"
      traefik.http.middlewares.sc-ratelimit.ratelimit.burst: "100"
      traefik.http.middlewares.sc-ratelimit.ratelimit.redis.endpoints: redis:6379
      traefik.http.middlewares.sc-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.sc-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.sc-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.sc-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.sc-headers.headers.permissionsPolicy: camera=(), microphone=(), geolocation=()

configs:
  nginx_cache:
    content: |
      # Cache HTTP devant Saltcorn.
      # - fichiers (CSS, JS, images) : gardés en mémoire selon leurs en-têtes
      #   (le kit envoie « immutable » : 1 an) ;
      # - pages publiques : gardées seulement si Saltcorn les déclare publiques
      #   (Utilisateurs et sécurité → HTTP → « Public cache TTL »), et jamais pour
      #   un visiteur connecté (cookie connect.sid) ni une réponse qui pose un cookie.
      # - WebSocket (temps réel) transmis tel quel.
      resolver 127.0.0.11 valid=10s ipv6=off;
      proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=sc:64m max_size=450m inactive=2h use_temp_path=off;
      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_cookie $$sc_logged { default 0; "~*connect\.sid=" 1; }
      server {
        listen 80;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        # fichiers statiques (Saltcorn, modules, kit) : jamais propres à un utilisateur.
        # Saltcorn pose un cookie de session sur toutes ses réponses : on l'ignore ici.
        location ~ ^/(static_assets|plugins/public|dysizz-ui/a)/ {
          set $$up http://saltcorn:3000;
          proxy_pass $$up;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$http_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
          proxy_cache sc;
          proxy_cache_key "$$scheme$$host$$request_uri$$http_accept_encoding";
          proxy_ignore_headers Set-Cookie;
          proxy_hide_header Set-Cookie;
          proxy_cache_valid 200 30d;
          proxy_cache_lock on;
          add_header X-Cache $$upstream_cache_status always;
        }
        # Exemple : une landing page publique SANS formulaire, gardée 5 min.
        # (une page avec formulaire a besoin de son cookie : ne pas la mettre ici)
        # location = /page/accueil {
        #   set $$up http://saltcorn:3000; proxy_pass $$up; proxy_set_header Host $$host;
        #   proxy_set_header X-Forwarded-For $$http_x_forwarded_for; proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
        #   proxy_cache sc; proxy_cache_key "$$scheme$$host$$request_uri";
        #   proxy_cache_bypass $$sc_logged; proxy_no_cache $$sc_logged;
        #   proxy_ignore_headers Set-Cookie Cache-Control Expires; proxy_hide_header Set-Cookie;
        #   proxy_cache_valid 200 5m; add_header X-Cache $$upstream_cache_status always;
        # }
        location / {
          set $$up http://saltcorn:3000;
          proxy_pass $$up;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          # on garde l'adresse du visiteur posée par Traefik (Saltcorn fait confiance à 1 relais)
          proxy_set_header X-Forwarded-For $$http_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_cache sc;
          proxy_cache_key "$$scheme$$host$$request_uri";
          proxy_cache_bypass $$sc_logged $$http_upgrade;
          proxy_no_cache $$sc_logged $$http_upgrade;
          proxy_cache_lock on;
          proxy_cache_background_update on;
          proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
          add_header X-Cache $$upstream_cache_status always;
        }
      }

volumes:
  pgdata:

networks:
  internal:
  dokploy-network:
    external: true
